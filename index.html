case'rename':return sheet(`<h3 style="margin-top:0">تعديل الاسم</h3>${fld('rn','الاسم الكامل','text','',S.name)}<button class="btn" data-act="renamego">حفظ</button>`);
case'renamego':{const v=$('#rn').value.trim();if(v.length<2)return toast('الرجاء إدخال الاسم الكامل',1);S.name=v;closeSheet();toast('تم الحفظ');return done()}
case'ver':if(S.vf[D.v])return toast('تم توثيق هذا الحساب بالفعل');S.vf[D.v]=1;toast('تم التوثيق بنجاح');return done();
case'pw':return sheet(`<h3 style="margin-top:0">تغيير كلمة المرور</h3>${fld('p0','كلمة المرور الحالية','password')}${fld('p1','كلمة المرور الجديدة','password')}${fld('p2','تأكيد كلمة المرور الجديدة','password')}<button class="btn" data-act="pwgo">تحديث كلمة المرور</button>`);
case'pwgo':if(!$('#p0').value)return toast('الرجاء إدخال كلمة المرور الحالية',1);if($('#p1').value.length<6)return toast('يجب أن تتكون كلمة المرور من 6 أحرف على الأقل',1);if($('#p1').value!=$('#p2').value)return toast('كلمات المرور غير متطابقة',1);closeSheet();return toast('تم تغيير كلمة المرور بنجاح!');
case'terms':return sheet(`<h3 style="margin-top:0">شروط وأحكام الاستخدام</h3><details open><summary>١. المقدمة</summary><p>تحكم هذه الشروط وصولك إلى التطبيق واستخدامه. من خلال استخدامه فإنك توافق على الالتزام بها.</p></details><details><summary>٤. حساب المستخدم</summary><p>أنت مسؤول عن سرية معلومات الدخول وعن جميع الأنشطة التي تتم تحت حسابك.</p></details><details><summary>٦. الاستخدام المقبول</summary><p>يُمنع استخدام التطبيق لأغراض غير قانونية أو الاحتيال أو انتهاك حقوق الآخرين.</p></details><details><summary>١١. الحذف التلقائي للحساب</summary><p>تُحذف الحسابات غير النشطة لمدة 90 يوماً تلقائياً.</p></details><button class="btn" style="margin-top:12px" onclick="closeSheet()">موافق</button>`);
case'cur2':return;
case'theme':S.th=S.th=='dark'?'light':'dark';document.documentElement.dataset.th=S.th;return done();
case'fast':S.fast=!S.fast;S.ct.start=0;toast(S.fast?'دورة العداد الآن 60 ثانية':'عادت الدورة إلى 24 ساعة');return done();
case'donate':{const mx=Math.max(100,Math.min(S.pts,5000));return sheet(`<h3 style="margin-top:0;text-align:center">التبرع للجمعيات الخيرية</h3><div class="card cy" style="text-align:center;padding:12px">رصيد النقاط المتاح: <b>${f(S.pts)}</b> نقطة</div><label>قيمة التبرع: <b class="cy" id="dv">100</b> نقطة<input type="range" id="ds" min="100" max="${mx}" step="50" value="100"></label><b style="display:block;margin:10px 0 4px">اختر الجمعية التي تريد التبرع لها:</b>${[['جمعية الهلال الأحمر','مساعدة المحتاجين في حالات الطوارئ والكوارث'],['مؤسسة رعاية الأيتام','توفير الرعاية والدعم للأطفال الأيتام'],['جمعية حماية البيئة','المساهمة في حماية البيئة والموارد الطبيعية']].map((x,i)=>`<label class="card row" style="cursor:pointer;padding:12px;margin-bottom:8px"><input type="radio" name="ch" value="${x[0]}" style="width:auto;margin:0" ${i?'':'checked'}><div class="ci">${ic('heart')}</div><div class="sp"><b style="color:var(--tx)">${x[0]}</b><div class="mu" style="font-size:.8rem">${x[1]}</div></div></label>`).join('')}<div class="g2"><button class="btn o" onclick="closeSheet()">إلغاء</button><button class="btn" data-act="dgo">تبرع الآن</button></div>`)}
case'dgo':{const n=+$('#ds').value,c=$('input[name=ch]:checked').value;if(!need(n))return;log('تبرع لـ '+c,-n,'نقطة');note('شكراً لتبرعك',f(n)+' نقطة لصالح '+c);closeSheet();confetti();toast('تم التبرع بنجاح!');return done()}
case'readall':S.nt.forEach(n=>n.u=0);return done();
case'shopm':return sheet(`<h3 style="margin:0 0 14px;text-align:center">خيارات الشراء</h3>${[['store','قائمة التجار','go','merchants'],['cart','المتجر','go','store'],['coin','شراء نقاط','buyp','']].map(x=>`<button class="card row" style="width:100%;text-align:start;padding:14px" ${x[2]=='go'?`data-go="${x[3]}"`:`data-act="${x[2]}"`}><div class="ci">${ic(x[0])}</div><b class="sp" style="font-size:1.1rem">${x[1]}</b>${ic('chev')}</button>`).join('')}`);
case'buyp':return sheet(`<h3 style="margin-top:0">شراء نقاط</h3><p class="mu">الرصيد المتاح: ${money()}</p>${[[1000,1],[5000,5],[20000,18],[100000,85]].map(x=>`<div class="card row"><div class="ci">${ic('coin')}</div><b class="sp">${f(x[0])} نقطة</b><button class="btn s" data-act="bpgo" data-n="${x[0]}" data-u="${x[1]}">$${x[1]}</button></div>`).join('')}`);
case'bpgo':if(S.usd<+D.u)return toast('رصيد الدولار غير كافٍ',1);S.usd-=+D.u;S.pts+=+D.n;log('شراء نقاط',+D.n,'نقطة');closeSheet();toast('تمت العملية بنجاح!');return done();
}}
function payp(){const m=find($('#pk').value);$('#pd').innerHTML=m?`<span class="ok">${m.n}</span> · نسبة الخصم <b class="cy">${m.d}%</b>`:'رمز التاجر غير معروف'}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-act],[data-back]');if(!b)return;const D=b.dataset;if(D.back!==undefined){D.back?go(D.back):history.back();return}if(D.go){closeSheet();go(D.go);return}act(D.act,D)});
document.addEventListener('input',e=>{const x=e.target;if(x.id=='uq'){T.uq=x.value;$('#ul').innerHTML=ulist()}else if(x.id=='im')impt(x.dataset.i);else if(x.id=='la'||x.id=='lm')loanp();else if(x.id=='ds')$('#dv').textContent=x.value;else if(x.id=='pk')payp();else if(x.id=='ta'&&T.tt=='friend')$('#tfee').textContent='رسوم التحويل (5%): '+f(Math.ceil((+x.value||0)*.05))});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='cm')act('send',{k:e.target.dataset.k})});
document.documentElement.dataset.th=S.th;if(!location.hash)location.hash=S.auth?'#home':'#welcome';paint(1);
