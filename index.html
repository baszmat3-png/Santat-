<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>SNTAT - سنتات</title><style>
:root{--bg:#eef6f5;--card:#f4fbfa;--line:#7fc4bd;--teal:#2a9d93;--orange:#f28a12;--text:#0d3f3b;--sub:#5d8a86;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1b1a;--card:#122827;--line:#2f6f69;--text:#d9f2ef;--sub:#86b5b0}}
:root[data-theme="dark"]{--bg:#0b1b1a;--card:#122827;--line:#2f6f69;--text:#d9f2ef;--sub:#86b5b0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;max-width:480px;margin:0 auto;padding:14px 14px 100px;min-height:100vh}
button,input{font-family:inherit;color:inherit}
.top{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between}
.stat small{font-size:11px;color:var(--sub);display:block;text-align:center}.stat b{font-size:22px;display:block;text-align:center}.stat>div{flex:1}
.ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.dial{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:18px auto 14px}
.ring{position:absolute;inset:0;border-radius:50%;border:9px solid var(--teal);background:var(--card);padding:10px}
.ring2{width:100%;height:100%;border-radius:50%;border:8px solid var(--orange);background:radial-gradient(circle,#0b3a37,#062624);overflow:hidden;position:relative;display:grid;place-items:center}
.ring2 canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.ball{position:absolute;top:-8px;left:50%;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffc766,var(--orange));box-shadow:0 3px 8px #0004;z-index:3;transform-origin:13px calc(min(78vw,300px)/2 + 8px)}
.dial.on .ball{animation:spin 6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.pill{position:relative;z-index:2;background:#fff;color:#0d3f3b;border-radius:20px;padding:9px 18px;font-size:13px;box-shadow:0 2px 8px #0003;white-space:nowrap}.pill b{color:var(--orange);margin:0 4px;font-size:15px}
.row{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.btn{background:var(--card);border:2px solid var(--line);border-radius:18px;height:46px;display:flex;align-items:center;justify-content:space-between;padding:4px;font-size:15px;cursor:pointer}
.btn .c{width:36px;height:36px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:18px}
.btn.on .c{background:var(--orange)}
.btn.store{font-size:12px;color:var(--sub)}.btn.store span:last-child{flex:1;text-align:center}
.banner{margin-top:14px;height:118px;border-radius:14px;overflow:hidden;position:relative;background:linear-gradient(120deg,#05100f,#14302d 55%,#3a2a12);color:#fff}
.sl{position:absolute;inset:0;opacity:0;transition:.5s;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px}.sl.a{opacity:1}
.sl h3{font-size:19px;line-height:1.4}.sl em{font-style:normal;color:#e9c46a}.sl p{font-size:12px;color:#e9c46a}
.dots{position:absolute;bottom:6px;left:0;right:0;display:flex;justify-content:center;gap:5px}.dots span{width:5px;height:5px;border-radius:50%;background:#fff6}.dots .a{background:#fff}
.item{margin-top:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.item .i{width:42px;height:42px;border-radius:12px;background:#cde9e5;color:var(--teal);display:grid;place-items:center;font-size:20px}
.item .t{flex:1}.item .t b{font-size:16px;display:block}.item .t small{font-size:11px;color:var(--sub)}
.item .l{color:var(--sub);font-size:13px;display:flex;align-items:center;gap:8px}
.tag{border:1px solid var(--line);border-radius:10px;padding:1px 8px;font-size:10px;font-weight:700;color:var(--teal)}
.h{font-size:18px;font-weight:700;margin:4px 0 10px;display:flex;align-items:center;gap:8px}
.back{background:var(--card);border:2px solid var(--line);border-radius:12px;width:36px;height:36px;cursor:pointer;font-size:16px}
.sm{background:var(--teal);color:#fff;border:0;border-radius:12px;padding:8px 14px;font-size:13px;cursor:pointer}.sm.o{background:var(--orange)}.sm.g{background:transparent;color:var(--teal);border:1px solid var(--line)}
.in{width:100%;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px;font-size:14px;margin-bottom:8px}
.fm{display:flex;gap:8px}.fm .in{margin:0;flex:1}
nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -4px 16px #0002;display:flex;justify-content:space-around;padding:10px 6px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{background:0;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--sub);width:62px;cursor:pointer}
nav button .n{width:36px;height:36px;display:grid;place-items:center;font-size:19px;border-radius:12px}
nav button.act{color:var(--text);font-weight:700}nav button.act .n{background:var(--orange);color:#fff}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#0d3f3b;color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;opacity:0;transition:.3s;z-index:9;pointer-events:none}#toast.s{opacity:1}
.mt{margin-top:12px}.c2{text-align:center;color:var(--sub);font-size:13px;padding:14px}
.gb{width:100%;background:#fff;color:#333;border:1px solid #ddd;border-radius:12px;padding:11px;font-size:14px;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center;margin-top:8px}.gb b{color:#4285f4;font-size:18px}.dv{text-align:center;color:var(--sub);font-size:12px;margin:12px 0}.lk{background:0;border:0;color:var(--teal);cursor:pointer;font-size:13px;width:100%;margin-top:10px}.wn{background:#f28a1220;border:1px solid var(--orange);border-radius:12px;padding:10px;font-size:12px;margin-bottom:12px;line-height:1.6}.cd{font-size:28px;letter-spacing:6px;text-align:center;font-weight:700;color:var(--orange);margin:6px 0}</style></head><body><div id="toast"></div><div id="app"></div><nav id="nav"></nav><script>
const $=i=>document.getElementById(i),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),F=n=>Math.floor(n||0).toLocaleString('en-US'),v=i=>$(i).value.trim();
let M=null,tab='counter',sub='',AM='in',PE='',D={};
const T=m=>{const e=$('toast');e.textContent=m;e.className='s';clearTimeout(T.h);T.h=setTimeout(()=>e.className='',2200)};
const api=async(p,b)=>{const r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok){if(r.status==401&&p=='me')M=null;throw new Error(j.error||'خطأ')}return j};
const act=async(p,b,ok)=>{try{await api(p,b);ok&&T(ok);await load()}catch(e){T(e.message)}};
async function load(){try{M=await api('me');M.at=Date.now();const k=sub||tab;if(k=='p2p')D.p2p=(await api('p2p',{})).list;if(k=='store')D.store=(await api('store',{})).items;if(k=='rooms')D.rooms=(await api('rooms',{})).rooms;if(k=='friends')D.fr=(await api('friends',{})).friends}catch(e){M=null}draw()}
const pts=()=>M.wallet.points+(M.session?(Date.now()-M.at)*M.wallet.size/864e5:0);
const cd=()=>{const l=M.session?Math.max(0,Math.floor((new Date(M.session.end)-Date.now())/1e3)):86400,p=n=>String(n).padStart(2,'0');return p(Math.floor(l/3600))+':'+p(Math.floor(l%3600/60))+':'+p(l%60)};
const hd=()=>`<div class="top"><div class="stat"><div><small>مجموع النقاط</small><b id="tp">${F(pts())}</b></div><span class="ic" style="background:var(--orange)">∞</span></div><div class="stat"><span class="ic" style="background:var(--teal)">$</span><div><small>الرصيد بالدولار</small><b>${M.wallet.usd.toFixed(2)}</b></div></div></div>`;
const back=t=>`<div class="h"><button class="back" onclick="go(tab,'')">›</button>${t}</div>`;
const ann=()=>`<div class="banner"><div class="sl a"><div><h3>${M.config.announcement?E(M.config.announcement):'اربح نقاط يومياً'}</h3><p>${M.config.announcement?'':'شغّل العداد كل 24 ساعة'}</p></div></div></div>`;
const V={
home:()=>hd()+ann()+`<div class="item" onclick="act('bonus',{},'تم استلام المكافأة 🎁')"><div class="i">🎁</div><div class="t"><b>المكافأة اليومية</b><small>اضغط لاستلام ${F(M.config.daily_bonus)} نقطة</small></div><div class="l">‹</div></div><div class="item" onclick="go('counter','wallet')"><div class="i">👛</div><div class="t"><b>المحفظة</b></div><div class="l">‹</div></div><div class="item" onclick="go('counter','p2p')"><div class="i">⇄</div><div class="t"><b>متجر المستخدمين P2P</b></div><div class="l">‹</div></div>`,
counter:()=>sub?V[sub]():hd()+`<div class="dial${M.session?' on':''}"><div class="ring"><div class="ring2"><canvas id="mx"></canvas><div class="pill">حجم عدادي <b>${F(M.wallet.size)}</b> نقطة</div></div></div><div class="ball"></div></div><div class="row"><div class="btn${M.session?' on':''}" onclick="act('mine',{},'بدأ التعدين ⚡')"><span class="c">⏻</span><span id="tm" style="flex:1;text-align:center;font-weight:600">${cd()}</span></div><div class="btn store" onclick="go('counter','store')"><span class="c" style="width:30px;height:30px">+</span><span>متجر العدادات 🛒</span></div></div>${ann()}<div class="item" onclick="go('counter','wallet')"><div class="i">👛</div><div class="t"><b>المحفظة</b></div><div class="l"><span>${F(M.wallet.points)} نقطة</span>‹</div></div><div class="item" onclick="go('counter','p2p')"><div class="i">⇄</div><div class="t"><b>متجر المستخدمين P2P</b><small>بيع وشراء النقاط بين المستخدمين</small></div><div class="l"><span class="tag">P2P</span>‹</div></div>`,
store:()=>back('متجر العدادات')+hd()+(D.store||[]).map(i=>`<div class="item"><div class="i">⚡</div><div class="t"><b>+${F(i.add_size)} حجم</b><small>السعر ${F(i.price_points)} نقطة</small></div><button class="sm o" onclick="act('store/buy',{id:${i.id}},'تم الشراء ✅')">شراء</button></div>`).join(''),
wallet:()=>back('المحفظة')+hd()+`<div class="item"><div class="t"><b>تحويل النقاط إلى دولار</b><small>كل ${F(M.config.points_per_usd)} نقطة = $1</small></div></div><div class="fm mt"><input class="in" id="cv" type="number" placeholder="عدد النقاط"><button class="sm" onclick="act('convert',{points:v('cv')},'تم التحويل')">تحويل</button></div><div class="h mt">السجل</div>`+(M.tx.length?M.tx.map(t=>`<div class="item" style="padding:9px;margin-top:6px"><small>${E(t.note||t.type)} · ${t.points>0?'+':''}${F(t.points)} نقطة${t.usd_cents?' · $'+(t.usd_cents/100).toFixed(2):''}</small></div>`).join(''):'<p class="c2">لا توجد عمليات</p>'),
p2p:()=>back('متجر المستخدمين P2P')+hd()+`<div class="item"><div class="t"><b>عرض نقاطك للبيع</b></div></div><div class="fm mt"><input class="in" id="sp" type="number" placeholder="النقاط"><input class="in" id="su" type="number" step="0.1" placeholder="السعر $"><button class="sm o" onclick="act('p2p/sell',{points:v('sp'),usd:v('su')},'تم نشر العرض')">بيع</button></div><div class="h mt">العروض</div>`+((D.p2p||[]).map(l=>`<div class="item"><div class="i">${l.mine?'🧑':'👤'}</div><div class="t"><b>${F(l.points)} نقطة</b><small>${l.mine?'عرضك':E(l.seller)} · $${(l.price_cents/100).toFixed(2)}</small></div>${l.mine?`<button class="sm g" onclick="act('p2p/cancel',{id:${l.id}})">إلغاء</button>`:`<button class="sm" onclick="act('p2p/buy',{id:${l.id}},'تمت عملية الشراء ✅')">شراء</button>`}</div>`).join('')||'<p class="c2">لا توجد عروض</p>'),
rooms:()=>`<div class="h">الغرف</div><div class="fm"><input class="in" id="rn" placeholder="اسم غرفة جديدة"><button class="sm" onclick="act('rooms/create',{name:v('rn')})">إنشاء</button></div>`+(D.rooms||[]).map(r=>`<div class="item"><div class="i">📡</div><div class="t"><b>${E(r.name)}</b><small>${r.members} عضو</small></div><button class="sm ${r.joined?'g':'o'}" onclick="act('rooms/join',{id:${r.id}})">${r.joined?'مغادرة':'انضمام'}</button></div>`).join(''),
friends:()=>`<div class="h">الأصدقاء</div><div class="item"><div class="t"><b>رمز دعوتك: ${E(M.user.invite)}</b><small>شاركه ليسجّل أصدقاؤك به</small></div><button class="sm" onclick="navigator.clipboard&&navigator.clipboard.writeText('${E(M.user.invite)}');T('تم نسخ الرمز')">نسخ</button></div><div class="fm mt"><input class="in" id="fn" placeholder="أدخل رمز صديقك"><button class="sm o" onclick="act('friends/add',{code:v('fn')},'تمت الإضافة')">إضافة</button></div>`+((D.fr||[]).map(f=>`<div class="item"><div class="i">👤</div><div class="t"><b>${E(f.name)}</b></div></div>`).join('')||'<p class="c2">لم تضف أصدقاء بعد</p>'),
account:()=>`<div class="h">حسابي</div><div class="item"><div class="i">👤</div><div class="t"><b>${E(M.user.name)}</b><small>${E(M.user.email)}</small></div></div><div class="fm mt"><input class="in" id="nm" placeholder="الاسم الجديد"><button class="sm" onclick="act('name',{name:v('nm')},'تم الحفظ')">حفظ</button></div>`+hd()+(M.user.role=='admin'?`<div class="item" onclick="location.href='/admin.html'"><div class="i">🛠</div><div class="t"><b>لوحة التحكم</b></div><div class="l">‹</div></div>`:'')+`<div class="item" onclick="th()"><div class="i">🌓</div><div class="t"><b>الوضع الليلي</b></div></div><div class="item" onclick="lo()"><div class="i">🚪</div><div class="t"><b>تسجيل الخروج</b></div></div>`};
const gb='';
function au(){$('nav').innerHTML='';const h='<div style="text-align:center;margin:20px 0"><div style="font-size:34px">👑</div><div style="font-size:24px;font-weight:800;color:var(--orange)">SNTAT</div></div>';let b='';
if(AM=='in')b=`<div class="h">تسجيل الدخول</div><input class="in" id="ae" type="email" placeholder="البريد الإلكتروني"><input class="in" id="ap" type="password" placeholder="كلمة المرور"><button class="sm o" style="width:100%" onclick="li()">دخول</button><button class="lk" onclick="AM='up';au()">ليس لديك حساب؟ أنشئ حساباً جديداً</button>`;
else if(AM=='up')b=`<div class="h">إنشاء حساب جديد</div><input class="in" id="an" placeholder="الاسم"><input class="in" id="ae" type="email" placeholder="البريد الإلكتروني"><input class="in" id="ap" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)"><input class="in" id="ac" type="password" placeholder="تأكيد كلمة المرور"><input class="in" id="ai" placeholder="رمز دعوة (اختياري)"><button class="sm o" style="width:100%" onclick="su()">إرسال رمز التحقق</button><button class="lk" onclick="AM='in';au()">لدي حساب بالفعل</button>`;
else b=`<div class="h">تأكيد البريد</div><p class="c2" style="padding:0 0 8px">أدخل الرمز المرسل إلى<br><b>${E(PE)}</b></p><input class="in" id="ao" inputmode="numeric" maxlength="6" placeholder="------" style="text-align:center;font-size:20px;letter-spacing:6px"><button class="sm o" style="width:100%" onclick="vo()">تأكيد ودخول</button><button class="sm g" style="width:100%;margin-top:8px" onclick="rs()">إعادة إرسال الرمز</button><button class="lk" onclick="AM='up';au()">رجوع</button>`;
$('app').innerHTML=h+b}
const li=async()=>{try{await api('login',{email:v('ae'),password:$('ap').value});await load()}catch(e){T(e.message)}};
const su=async()=>{if($('ap').value!=$('ac').value)return T('كلمتا المرور غير متطابقتين');PE=v('ae');window.PW={name:v('an'),email:PE,password:$('ap').value,invite:v('ai')};rs(1)};
const rs=async f=>{try{await api('signup',PW);AM='otp';au();T('تم إرسال الرمز إلى بريدك')}catch(e){T(e.message)}};
const vo=async()=>{try{await api('verify',{email:PE,code:v('ao')});await load()}catch(e){T(e.message)}};
const lo=async()=>{await api('logout',{});M=null;AM='in';draw()};
const th=()=>{const r=document.documentElement;r.setAttribute('data-theme',r.getAttribute('data-theme')=='dark'?'light':'dark')};
function go(t,s){tab=t;sub=s;load();scrollTo(0,0)}
function draw(){if(!M){au();return}$('app').innerHTML=V[tab]();$('nav').innerHTML=[['home','⌂','الرئيسية'],['counter','◔','العداد'],['rooms','((•))','الغرف'],['friends','👥','الأصدقاء'],['account','👤','حسابي']].map(x=>`<button class="${tab==x[0]?'act':''}" onclick="go('${x[0]}','')"><span class="n">${x[1]}</span>${x[2]}</button>`).join('');mx()}
let mt;function mx(){clearInterval(mt);const c=$('mx');if(!c)return;const x=c.getContext('2d'),W=c.width=c.offsetWidth,H=c.height=c.offsetHeight,n=Math.floor(W/14),d=Array.from({length:n},()=>Math.random()*H/14);mt=setInterval(()=>{x.fillStyle='rgba(6,38,36,.15)';x.fillRect(0,0,W,H);x.fillStyle='#2fe0a0';x.font='12px monospace';for(let i=0;i<n;i++){x.fillText(Math.random()<.5?'0':'1',i*14,d[i]*14);if(d[i]*14>H&&Math.random()>.97)d[i]=0;d[i]+=.5}},80)}
setInterval(()=>{if(!M)return;const a=$('tm'),b=$('tp');if(a)a.textContent=cd();if(b)b.textContent=F(pts())},1000);
setInterval(()=>{if(M&&!document.activeElement.id)load()},20000);
load();
</script></body></html>
